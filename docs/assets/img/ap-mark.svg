<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Akkoro Pacific — AP mark, compass/target style -->

  <!-- Outer ring -->
  <circle cx="20" cy="20" r="17.5" fill="none" stroke="#B89650" stroke-width="1.5"/>

  <!-- Cardinal tick marks (long, outside ring) -->
  <line x1="20"   y1="1"    x2="20"   y2="8"    stroke="#B89650" stroke-width="1.5"/>
  <line x1="20"   y1="32"   x2="20"   y2="39"   stroke="#B89650" stroke-width="1.5"/>
  <line x1="1"    y1="20"   x2="8"    y2="20"   stroke="#B89650" stroke-width="1.5"/>
  <line x1="32"   y1="20"   x2="39"   y2="20"   stroke="#B89650" stroke-width="1.5"/>

  <!-- Intercardinal tick marks (short, inside ring) -->
  <line x1="29.2" y1="10.8" x2="32"   y2="8"    stroke="#B89650" stroke-width="1" opacity="0.45"/>
  <line x1="10.8" y1="10.8" x2="8"    y2="8"    stroke="#B89650" stroke-width="1" opacity="0.45"/>
  <line x1="29.2" y1="29.2" x2="32"   y2="32"   stroke="#B89650" stroke-width="1" opacity="0.45"/>
  <line x1="10.8" y1="29.2" x2="8"    y2="32"   stroke="#B89650" stroke-width="1" opacity="0.45"/>

  <!-- Inner targeting ring -->
  <circle cx="20" cy="20" r="5.5" fill="none" stroke="#B89650" stroke-width="1" opacity="0.5"/>

  <!-- Center dot -->
  <circle cx="20" cy="20" r="2.2" fill="#B89650"/>
</svg>
