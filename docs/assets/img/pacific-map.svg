<svg viewBox="0 0 1440 560" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace">
  <!--
    Pacific AOR — full-width background map
    Transparent bg — overlaid on hero gradient
    Projection: 120°E → 150°W, 30°N → 25°S
    x = (lonE - 120) / 90 * 1440
    y = (30 - lat)   / 55 * 560
  -->

  <!-- ── MINOR GRID (every 5°, very faint) ── -->
  <g stroke="#1A4570" stroke-width="0.5" opacity="0.5">
    <!-- Longitude minor -->
    <line x1="80"   y1="0" x2="80"   y2="560"/>
    <line x1="240"  y1="0" x2="240"  y2="560"/>
    <line x1="400"  y1="0" x2="400"  y2="560"/>
    <line x1="560"  y1="0" x2="560"  y2="560"/>
    <line x1="720"  y1="0" x2="720"  y2="560"/>
    <line x1="880"  y1="0" x2="880"  y2="560"/>
    <line x1="1040" y1="0" x2="1040" y2="560"/>
    <line x1="1200" y1="0" x2="1200" y2="560"/>
    <line x1="1360" y1="0" x2="1360" y2="560"/>
    <!-- Latitude minor -->
    <line x1="0" y1="51"  x2="1440" y2="51"/>
    <line x1="0" y1="153" x2="1440" y2="153"/>
    <line x1="0" y1="255" x2="1440" y2="255"/>
    <line x1="0" y1="357" x2="1440" y2="357"/>
    <line x1="0" y1="459" x2="1440" y2="459"/>
  </g>

  <!-- ── MAJOR GRID (every 10°) ── -->
  <g stroke="#2C5580" stroke-width="0.9" opacity="0.7">
    <!-- Longitude major: 130°E=160, 140°E=320, 150°E=480, 160°E=640, 170°E=800, 180°=960, 170°W=1120, 160°W=1280 -->
    <line x1="160"  y1="0" x2="160"  y2="560"/>
    <line x1="320"  y1="0" x2="320"  y2="560"/>
    <line x1="480"  y1="0" x2="480"  y2="560"/>
    <line x1="640"  y1="0" x2="640"  y2="560"/>
    <line x1="800"  y1="0" x2="800"  y2="560"/>
    <line x1="960"  y1="0" x2="960"  y2="560" stroke="#3A6FA0" stroke-width="1.5"/>
    <line x1="1120" y1="0" x2="1120" y2="560"/>
    <line x1="1280" y1="0" x2="1280" y2="560"/>
    <!-- Latitude major: 20°N=102, 10°N=204, EQ=306, 10°S=407, 20°S=509 -->
    <line x1="0" y1="102" x2="1440" y2="102"/>
    <line x1="0" y1="204" x2="1440" y2="204"/>
    <line x1="0" y1="306" x2="1440" y2="306" stroke="#3A6FA0" stroke-width="1.5"/>
    <line x1="0" y1="407" x2="1440" y2="407"/>
    <line x1="0" y1="509" x2="1440" y2="509"/>
  </g>

  <!-- ── DATELINE LABEL ── -->
  <text x="960" y="20" fill="#2C5580" font-size="10" text-anchor="middle" letter-spacing="0.12em" opacity="0.7">180°</text>
  <text x="960" y="550" fill="#2C5580" font-size="10" text-anchor="middle" letter-spacing="0.12em" opacity="0.7">INTERNATIONAL DATE LINE</text>

  <!-- ── EQUATOR LABEL ── -->
  <text x="16" y="303" fill="#2C5580" font-size="9" letter-spacing="0.1em" opacity="0.7">EQ</text>
  <text x="1424" y="303" fill="#2C5580" font-size="9" text-anchor="end" letter-spacing="0.1em" opacity="0.7">EQ</text>

  <!-- ── COORDINATE LABELS (sparse, corners + key lines) ── -->
  <g fill="#1A4570" font-size="9" opacity="0.8" letter-spacing="0.08em">
    <text x="155"  y="14" text-anchor="middle">130°E</text>
    <text x="315"  y="14" text-anchor="middle">140°E</text>
    <text x="475"  y="14" text-anchor="middle">150°E</text>
    <text x="635"  y="14" text-anchor="middle">160°E</text>
    <text x="795"  y="14" text-anchor="middle">170°E</text>
    <text x="1115" y="14" text-anchor="middle">170°W</text>
    <text x="1275" y="14" text-anchor="middle">160°W</text>
    <text x="8" y="99">20°N</text>
    <text x="8" y="201">10°N</text>
    <text x="8" y="404">10°S</text>
    <text x="8" y="506">20°S</text>
  </g>

  <!-- ── TERRITORY CONNECTIONS (dashed routing lines) ── -->
  <!-- Guam(395,169) — Hawaii(1315,88) — AmSamoa(1109,451) / CNMI(411,151) — Guam -->
  <g stroke="#B89650" stroke-width="1" fill="none" stroke-dasharray="6,10" opacity="0.3">
    <line x1="411"  y1="151" x2="395"  y2="169"/>
    <line x1="395"  y1="169" x2="1315" y2="88"/>
    <line x1="1315" y1="88"  x2="1109" y2="451"/>
  </g>

  <!-- ── RANGE RINGS — Hawaii ── -->
  <circle cx="1315" cy="88"  r="60"  fill="none" stroke="#B89650" stroke-width="0.7" stroke-dasharray="4,8" opacity="0.2"/>
  <circle cx="1315" cy="88"  r="120" fill="none" stroke="#B89650" stroke-width="0.6" stroke-dasharray="4,8" opacity="0.13"/>
  <circle cx="1315" cy="88"  r="180" fill="none" stroke="#B89650" stroke-width="0.5" stroke-dasharray="4,8" opacity="0.08"/>

  <!-- ── SECONDARY ISLANDS (muted) ── -->
  <g fill="#1A4570" font-size="8" opacity="0.7">
    <!-- Palau (134.5°E → x=72, 7.5°N → y=225) -->
    <circle cx="72" cy="225" r="3" fill="#1A4570"/>
    <text x="80" y="223">PALAU</text>
    <!-- FSM Pohnpei (158°E → x=608, 7°N → y=234) -->
    <circle cx="608" cy="234" r="3" fill="#1A4570"/>
    <text x="616" y="232">FSM</text>
    <!-- Marshall Is (171°E → x=818, 7°N → y=234) -->
    <circle cx="818" cy="234" r="3" fill="#1A4570"/>
    <text x="826" y="232">MARSHALL IS.</text>
    <!-- Wake I (166.6°E → x=745, 19.3°N → y=89) -->
    <circle cx="745" cy="89" r="2.5" fill="#1A4570"/>
    <text x="751" y="87">WAKE I.</text>
    <!-- Johnston Atoll (169.5°W=190.5°E → x=1130, 16.7°N → y=135) -->
    <circle cx="1130" cy="135" r="2.5" fill="#1A4570"/>
    <!-- Midway (177.4°W=182.6°E → x=1011, 28.2°N → y=23) -->
    <circle cx="1011" cy="23" r="2.5" fill="#1A4570"/>
    <text x="1018" y="21">MIDWAY</text>
  </g>

  <!-- ── GUAM (144.7°E → x=395, 13.4°N → y=169) ── -->
  <g>
    <line x1="381" y1="169" x2="389" y2="169" stroke="#B89650" stroke-width="1" opacity="0.8"/>
    <line x1="401" y1="169" x2="409" y2="169" stroke="#B89650" stroke-width="1" opacity="0.8"/>
    <line x1="395" y1="155" x2="395" y2="163" stroke="#B89650" stroke-width="1" opacity="0.8"/>
    <line x1="395" y1="175" x2="395" y2="183" stroke="#B89650" stroke-width="1" opacity="0.8"/>
    <circle cx="395" cy="169" r="6"   fill="none" stroke="#B89650" stroke-width="1.2" opacity="0.9"/>
    <circle cx="395" cy="169" r="2.5" fill="#B89650"/>
    <text x="405" y="165" fill="#B89650" font-size="10" letter-spacing="0.12em">GUAM</text>
    <text x="405" y="178" fill="#7A9ABF" font-size="8"  letter-spacing="0.06em">U.S. TERRITORY</text>
  </g>

  <!-- ── CNMI (145.7°E → x=411, 15.2°N → y=151) ── -->
  <g>
    <circle cx="411" cy="151" r="5"   fill="none" stroke="#B89650" stroke-width="1.1" opacity="0.8"/>
    <circle cx="411" cy="151" r="2.2" fill="#B89650"/>
    <line x1="398" y1="151" x2="405" y2="151" stroke="#B89650" stroke-width="1" opacity="0.7"/>
    <line x1="417" y1="151" x2="424" y2="151" stroke="#B89650" stroke-width="1" opacity="0.7"/>
    <line x1="411" y1="138" x2="411" y2="145" stroke="#B89650" stroke-width="1" opacity="0.7"/>
    <line x1="411" y1="157" x2="411" y2="164" stroke="#B89650" stroke-width="1" opacity="0.7"/>
    <text x="420" y="147" fill="#B89650" font-size="9.5" letter-spacing="0.1em">CNMI</text>
    <text x="420" y="158" fill="#7A9ABF" font-size="7.5" letter-spacing="0.06em">U.S. TERRITORY</text>
  </g>

  <!-- ── HAWAI'I (202.2°E → x=1315, 21.3°N → y=88) ── -->
  <g>
    <line x1="1296" y1="88" x2="1305" y2="88" stroke="#B89650" stroke-width="1.2" opacity="0.9"/>
    <line x1="1325" y1="88" x2="1334" y2="88" stroke="#B89650" stroke-width="1.2" opacity="0.9"/>
    <line x1="1315" y1="69"  x2="1315" y2="78"  stroke="#B89650" stroke-width="1.2" opacity="0.9"/>
    <line x1="1315" y1="98"  x2="1315" y2="107" stroke="#B89650" stroke-width="1.2" opacity="0.9"/>
    <circle cx="1315" cy="88" r="10"  fill="none" stroke="#B89650" stroke-width="1.5" opacity="0.9"/>
    <circle cx="1315" cy="88" r="4"   fill="#B89650"/>
    <text x="1308" y="126" fill="#B89650" font-size="11" letter-spacing="0.14em" text-anchor="middle">HAWAI'I</text>
    <text x="1308" y="139" fill="#7A9ABF" font-size="8.5" letter-spacing="0.07em" text-anchor="middle">U.S. STATE</text>
  </g>

  <!-- ── AMERICAN SAMOA (170.7°W=189.3°E → x=1109, 14.3°S → y=451) ── -->
  <g>
    <line x1="1096" y1="451" x2="1103" y2="451" stroke="#B89650" stroke-width="1" opacity="0.8"/>
    <line x1="1115" y1="451" x2="1122" y2="451" stroke="#B89650" stroke-width="1" opacity="0.8"/>
    <line x1="1109" y1="438" x2="1109" y2="445" stroke="#B89650" stroke-width="1" opacity="0.8"/>
    <line x1="1109" y1="457" x2="1109" y2="464" stroke="#B89650" stroke-width="1" opacity="0.8"/>
    <circle cx="1109" cy="451" r="6"   fill="none" stroke="#B89650" stroke-width="1.2" opacity="0.9"/>
    <circle cx="1109" cy="451" r="2.5" fill="#B89650"/>
    <text x="1119" y="447" fill="#B89650" font-size="10"  letter-spacing="0.1em">AMERICAN SAMOA</text>
    <text x="1119" y="459" fill="#7A9ABF" font-size="8"   letter-spacing="0.06em">U.S. TERRITORY</text>
  </g>

  <!-- ── CORNER BRACKETS ── -->
  <g stroke="#1A4570" stroke-width="1.5" fill="none" opacity="0.6">
    <polyline points="0,24 0,0 24,0"/>
    <polyline points="1416,0 1440,0 1440,24"/>
    <polyline points="1440,536 1440,560 1416,560"/>
    <polyline points="24,560 0,560 0,536"/>
  </g>

  <!-- ── AOR LABEL ── -->
  <text x="720" y="549" fill="#1A4570" font-size="9" text-anchor="middle" letter-spacing="0.2em" opacity="0.8">
    USINDOPACOM AREA OF RESPONSIBILITY — AKKORO PACIFIC LLC
  </text>

</svg>
